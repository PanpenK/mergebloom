:root{
  --accent:#ff6f9f; --accentDark:#c9466f; --ink:#5a2a35;
  --cream:#fff8f2; --glass:rgba(255,250,246,.84); --edge:rgba(255,255,255,.95); --gold:#ffc23d; --goldDark:#d8891b;
  --font-ui:'Fredoka', ui-rounded, 'SF Pro Rounded', system-ui, sans-serif;
  --font-num:'Lilita One', 'Fredoka', ui-rounded, system-ui, sans-serif;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px); --safe-r:env(safe-area-inset-right,0px);
  --star:none;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{font-family:var(--font-ui);font-weight:500;color:var(--ink);background:#ffc9b8;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none}
#sky{position:fixed;inset:0;z-index:0;background-size:cover;background-position:center top}
#sky::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,0) 55%,rgba(255,236,226,.35) 100%)}
.screen{position:fixed;inset:0;z-index:1}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:focus-visible{outline:3px solid #fff;outline-offset:3px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:56px;padding:0 24px;
  border-radius:22px;font-weight:700;font-size:20px;color:#fff;background:var(--accent);
  box-shadow:inset 0 -5px 0 rgba(0,0,0,.14), inset 0 3px 0 rgba(255,255,255,.35), 0 6px 0 var(--accentDark), 0 12px 24px rgba(90,30,40,.18);
  text-shadow:0 2px 0 rgba(0,0,0,.12);transition:transform .08s, box-shadow .08s}
.btn:active{transform:translateY(5px);box-shadow:inset 0 -3px 0 rgba(0,0,0,.14), 0 1px 0 var(--accentDark), 0 4px 10px rgba(0,0,0,.1)}
.btn small{font-size:14px;font-weight:600;opacity:.9}
.btn.soft{background:var(--cream);color:var(--ink);text-shadow:none;
  box-shadow:inset 0 -5px 0 rgba(120,60,50,.10), 0 6px 0 #e3c2b6, 0 12px 24px rgba(90,30,40,.14)}
.btn.soft:active{box-shadow:0 1px 0 #e3c2b6}
.btn.gold{background:linear-gradient(180deg,#ffd86b,#ffb52e);color:#6b3a07;text-shadow:0 1px 0 rgba(255,255,255,.4);
  box-shadow:inset 0 -5px 0 rgba(0,0,0,.10), inset 0 3px 0 rgba(255,255,255,.5), 0 6px 0 var(--goldDark), 0 12px 24px rgba(90,40,10,.2)}
.btn.gold:active{box-shadow:0 1px 0 var(--goldDark)}
.icon-btn{width:48px;height:48px;border-radius:16px;background:var(--glass);display:grid;place-items:center;
  border:2px solid var(--edge);box-shadow:0 4px 0 rgba(120,60,50,.15)}
.icon-btn:active{transform:translateY(3px);box-shadow:none}
.icon-btn svg{width:24px;height:24px}

<script>
'use strict';
/* =====================================================================
   Mergebloom — flick-and-slide merge board. Ad-free.
   World is top-down: x across the board (0..W), y down the board from
   the far wall (0) to the near wall (L), drawn with a fake perspective.
   Modes: Adventure (map, goals, shot limits, stars), Daily Bake (same
   board for everyone today, 30 shots, streak), Classic (endless).
   ===================================================================== */
const { Engine, Bodies, Body, Composite, Events } = Matter;

/* ---------- storage ---------- */
const store = {
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} },
  json(k){ try{ return JSON.parse(localStorage.getItem(k)||'null'); }catch(e){ return null; } },
};
const K = { snd:'mb:sound', hap:'mb:haptics', ed:'mb:edition', save:'mb:save3', boost:'mb:boosts', daily:'mb:daily',
  best: id=>'mb:best:'+id, seen: id=>'mb:seen:'+id, lvl: id=>'mb:level:'+id, stars: id=>'mb:stars:'+id };
let soundOn = store.get(K.snd) !== '0';
let hapticsOn = store.get(K.hap) !== '0';

/* ---------- world ---------- */
const W = 400, L = 560;
const DANGER_Y = L - 110;                // pieces resting below this line = board full
const LAUNCH_Y = DANGER_Y + 26;          // where your piece waits
const RADII = [21, 27, 35, 44, 53, 62, 72, 83, 94, 106, 118];
const POINTS = [1, 3, 6, 10, 15, 21, 28, 36, 45, 55, 66];
const MAX = RADII.length - 1;
const RB = -1, RB_R = 30;                // rainbow sprinkle piece
const CUBE = 54;                         // sugar cube size
const STEP = 1000/60;
const SHOT_V = 13.5;
const D0 = 3 * L, KF = D0 / (D0 + L), FRONT = 16;
let DEPTH = 400;
const kAt = y => D0 / (D0 + L - y);
const ttAt = y => (kAt(y) - KF) / (1 - KF);
const tiltAt = y => DEPTH * kAt(y) / (D0 * (1 - KF));
const radOf = t => t === RB ? RB_R : RADII[t];

/* ---------- levels ----------
   Goal kinds: make a pastry (sometimes two of them), or crack every sugar cube.
   Shot budgets come from a bot that aims at matching pieces about as well as a
   distracted person; a Fruit Tart is a boss every 10th level. */
const BUDGET = { 4: 18, 5: 24, 6: 38, 7: 62, 8: 95 };
function levelSpec(n){
  let kind = 'make', goal, count = 1, cubes = 0, shots, boss = false;
  if (n <= 2){ goal = 4; }
  else if (n <= 5){ goal = 5; }
  else if (n <= 9){ goal = 6; cubes = n <= 7 ? 1 : 2; }
  else if (n <= 14){ goal = 7; cubes = n <= 11 ? 2 : 3; if (n === 12){ kind = 'cubes'; goal = null; cubes = 4; } }
  else if (n % 10 === 0){ goal = 8; boss = true; }
  else {
    const k = n % 5;
    if (k === 0){ goal = 6; count = 2; cubes = 2; }
    else if (k === 1 || k === 4){ goal = 7; cubes = 3; }
    else if (k === 2){ kind = 'cubes'; goal = null; cubes = 5; }
    else { goal = 6; count = 2; cubes = 3; }
  }
  if (kind === 'cubes') shots = 8 + cubes * 3;
  else if (count === 2) shots = 58;
  else shots = BUDGET[goal];
  const tight = n < 15 ? 0 : Math.min(.1, (n - 15) * .005);
  return {
    n, kind, goal, count, cubes, boss,
    shots: Math.round(shots * (1 - tight)),
    seeds: n < 2 ? 0 : kind === 'cubes' ? 4 : Math.min(2 + Math.floor(n/2), boss ? 4 : 8),
    gift: n % 5 === 0,
    spawnMax: goal === 4 ? 2 : goal === 5 ? 3 : 4,
  };
}
const goalText = (spec, ed) => spec.kind === 'cubes' ? `Crack all ${spec.cubes} sugar cubes`
  : `Make ${spec.count > 1 ? spec.count + ' ' + ed.tiers[spec.goal].name + 's' : 'a ' + ed.tiers[spec.goal].name}`;
const goalIcon = spec => spec.kind === 'cubes' ? 'cube' : spec.goal;
const SPAWN_W = [30, 26, 20, 14, 10];
function mulberry32(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

/* ---------- editions & art ---------- */
let ED = null;
const ART = {}, SCENE = {}, EXTRA = {};
function pad(n){ return String(n).padStart(2,'0'); }
function loadArt(ed){
  if (ART[ed.id]) return ART[ed.id];
  const list = ed.tiers.map((t,i)=>{
    const a = { img:null, ok:false, cache:new Map() };
    if (!ed.soon){
      const img = new Image(); img.decoding = 'async';
      img.onload = ()=>{ a.ok = true; a.cache.clear(); redrawStatic(); };
      img.src = t.img || `art/${ed.id}/${pad(i+1)}.webp`;
      a.img = img;
    }
    return a;
  });
  ART[ed.id] = list;
  const sc = SCENE[ed.id] = {};
  for (const key of ['bg','board','banner','card','map']){
    if (ed.soon || !ed.scene || !ed.scene[key]) continue;
    const img = new Image(); img.decoding = 'async';
    img.onload = ()=>{ sc[key] = img; if (ED === ed){ applyTheme(ed); boardCache = null; if (!$('map').hidden) renderMap(); } };
    img.src = `art/${ed.id}/${key}.webp`;
  }
  return list;
}
/* shared extras: booster pieces/icons, sugar cube, star */
for (const key of ['rainbow','whisk','swap','cube','star']){
  const a = EXTRA[key] = { img:null, ok:false, cache:new Map() };
  const img = new Image(); img.decoding = 'async';
  img.onload = ()=>{ a.ok = true; a.cache.clear();
    if (key === 'star'){ document.documentElement.style.setProperty('--star', `url("${img.src}")`); document.body.classList.remove('nostar'); }
    paintBoostIcons(); };
  img.src = `art/bakery/${key}.webp`; a.img = img;
}
function stepDown(src, px){
  let s = Math.max(src.naturalWidth || src.width, src.naturalHeight || src.height);
  while (s / 2 >= px * 1.2){
    const t = document.createElement('canvas'); s = Math.ceil(s/2); t.width = t.height = s;
    const tg = t.getContext('2d'); tg.imageSmoothingQuality = 'high'; tg.drawImage(src,0,0,s,s); src = t;
  }
  return src;
}
function sprite(ed, tier, px){
  px = Math.max(8, Math.ceil(px/4)*4);
  const a = tier === RB ? EXTRA.rainbow : tier === 'cube' ? EXTRA.cube : loadArt(ed)[tier];
  const key = px + (a.ok ? 'i' : 'f');
  let c = a.cache.get(key);
  if (c) return c;
  c = document.createElement('canvas'); c.width = c.height = px;
  const g = c.getContext('2d');
  if (a.ok){ g.imageSmoothingQuality = 'high'; g.drawImage(stepDown(a.img, px), 0, 0, px, px); }
  else if (tier === RB) drawRainbow(g, px);
  else if (tier === 'cube') drawCube(g, px);
  else drawBlob(g, px, ed.tiers[tier].color);
  a.cache.set(key, c);
  return c;
}
function shade(hex, amt){
  const n = parseInt(hex.slice(1),16); let r=n>>16, g=(n>>8)&255, b=n&255;
  const f = v => Math.max(0, Math.min(255, Math.round(amt<0 ? v*(1+amt) : v+(255-v)*amt)));
  return `rgb(${f(r)},${f(g)},${f(b)})`;
}
function lum(hex){ const n=parseInt(hex.slice(1),16); return (0.299*(n>>16)+0.587*((n>>8)&255)+0.114*(n&255))/255; }
function drawFace(g, r, cy, s, ink, sleepy){
  for (const k of [-1,1]){
    g.fillStyle = 'rgba(255,111,145,.45)'; g.beginPath(); g.ellipse(r+k*20*s, cy+7*s, 6.5*s, 4*s, 0, 0, Math.PI*2); g.fill();
    if (sleepy){ g.strokeStyle = ink; g.lineWidth = 2.4*s; g.lineCap = 'round'; g.beginPath(); g.moveTo(r+k*12*s-4*s, cy-2*s); g.quadraticCurveTo(r+k*12*s, cy+1*s, r+k*12*s+4*s, cy-2*s); g.stroke(); continue; }
    g.fillStyle = ink; g.beginPath(); g.ellipse(r+k*12*s, cy-2*s, 4.2*s, 5.4*s, 0, 0, Math.PI*2); g.fill();
    g.fillStyle = '#fff'; g.beginPath(); g.arc(r+k*12*s-1.4*s, cy-4*s, 1.7*s, 0, Math.PI*2); g.fill();
  }
  g.strokeStyle = ink; g.lineWidth = 2*s; g.lineCap = 'round'; g.lineJoin = 'round';
  g.beginPath(); g.moveTo(r-4.5*s, cy+4*s); g.quadraticCurveTo(r-2.25*s, cy+7*s, r, cy+4*s); g.quadraticCurveTo(r+2.25*s, cy+7*s, r+4.5*s, cy+4*s); g.stroke();
}
function drawBlob(g, px, color){
  const r = px/2;
  const grd = g.createRadialGradient(r*.72, r*.62, r*.1, r, r, r);
  grd.addColorStop(0, shade(color,.45)); grd.addColorStop(.7, color); grd.addColorStop(1, shade(color,-.28));
  g.fillStyle = grd; g.beginPath(); g.arc(r,r,r*.98,0,Math.PI*2); g.fill();
  g.fillStyle = 'rgba(255,255,255,.55)'; g.beginPath(); g.ellipse(r*.62, r*.5, r*.26, r*.14, -.6, 0, Math.PI*2); g.fill();
  drawFace(g, r, r*1.08, r/40, lum(color) < .35 ? '#fff' : '#3b2218');
}
function drawRainbow(g, px){
  const r = px/2, cols = ['#ff6b6b','#ffa94d','#ffe066','#69db7c','#4dabf7','#b197fc'];
  const grd = g.createRadialGradient(r*.7, r*.6, r*.1, r, r, r);
  grd.addColorStop(0, '#fff'); grd.addColorStop(.8, '#ffe3f1'); grd.addColorStop(1, '#f7b7d6');
  g.fillStyle = grd; g.beginPath(); g.arc(r,r,r*.97,0,Math.PI*2); g.fill();
  const R = mulberry32(5);
  for (let i=0;i<40;i++){
    const a = R()*6.28, d = Math.sqrt(R())*r*.8, x = r + Math.cos(a)*d, y = r + Math.sin(a)*d;
    g.save(); g.translate(x,y); g.rotate(R()*3); g.fillStyle = cols[i%6]; g.beginPath(); g.ellipse(0,0,r*.09,r*.03,0,0,6.28); g.fill(); g.restore();
  }
  drawFace(g, r, r*1.05, r/40, '#3b2218');
}
function drawCube(g, px){
  const s = px, r = s*.16;
  const grd = g.createLinearGradient(0,0,0,s); grd.addColorStop(0,'#ffffff'); grd.addColorStop(1,'#e9e3ef');
  g.fillStyle = grd; g.beginPath(); g.roundRect ? g.roundRect(s*.05,s*.05,s*.9,s*.9,r) : g.rect(s*.05,s*.05,s*.9,s*.9); g.fill();
  g.strokeStyle = 'rgba(160,140,170,.5)'; g.lineWidth = s*.02; g.stroke();
  g.fillStyle = 'rgba(255,255,255,.9)';
  for (let i=0;i<14;i++){ g.fillRect(s*(.15 + ((i*37)%70)/100), s*(.15 + ((i*53)%70)/100), s*.025, s*.025); }
  drawFace(g, s/2, s*.55, s/2/40, '#5a4a5f', true);
}
const shadows = new WeakMap();
function shadowOf(sp){
  let c = shadows.get(sp); if (c) return c;
  c = document.createElement('canvas'); c.width = sp.width; c.height = sp.height;
  const g = c.getContext('2d'); g.drawImage(sp, 0, 0);
  g.globalCompositeOperation = 'source-in'; g.fillStyle = 'rgba(70,30,45,.2)'; g.fillRect(0,0,c.width,c.height);
  shadows.set(sp, c); return c;
}
function paintIcon(cv, ed, tier, opts={}){
  const g = cv.getContext('2d'), w = cv.width, h = cv.height;
  g.clearRect(0,0,w,h);
  if (tier == null) return;
  const sz = Math.min(w,h) * (opts.scale || 1);
  const sp = opts.silhouette ? shadowOf(sprite(ed, tier, sz)) : sprite(ed, tier, sz);
  g.drawImage(sp, (w-sz)/2, (h-sz)/2, sz, sz);
}
/* booster icon element: Codex art when loaded, a drawn stand-in otherwise */
function boostIcon(key, px=46){
  const a = EXTRA[key];
  const c = document.createElement('canvas'); c.width = c.height = px*3;
  const g = c.getContext('2d');
  if (a.ok) g.drawImage(stepDown(a.img, px*3), 0, 0, px*3, px*3);
  else if (key === 'rainbow') drawRainbow(g, px*3);
  else {
    g.font = `${px*2.1}px 'Lilita One', sans-serif`; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.lineWidth = px*.25; g.strokeStyle = '#c9466f'; g.fillStyle = '#fff';
    const ch = key === 'whisk' ? '≋' : '⇄';
    g.strokeText(ch, px*1.5, px*1.6); g.fillText(ch, px*1.5, px*1.6);
  }
  return c;
}
const BOOST_NAMES = { rainbow:'Rainbow Sprinkle', whisk:'Whisk', swap:'Swap' };

/* ---------- audio ---------- */
let ac = null, comboPitch = 0;
function tone(f, t, dur, type='sine', vol=.1, slide=0){
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(f*slide, t+dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t+0.008); g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  o.connect(g).connect(ac.destination); o.start(t); o.stop(t+dur+0.02);
}
function sfx(kind, n=0){
  if (!soundOn || SIM) return;
  try{
    ac = ac || new (window.AudioContext||window.webkitAudioContext)();
    if (ac.state === 'suspended') ac.resume();
    const t = ac.currentTime;
    if (kind === 'shoot'){ tone(300, t, .14, 'sine', .07, 2.2); tone(900, t+.02, .06, 'triangle', .03); }
    if (kind === 'bump'){ tone(210 - n*8, t, .06, 'triangle', Math.min(.11, .04 + n*.008)); }
    if (kind === 'wall'){ tone(140, t, .05, 'square', .025); }
    if (kind === 'merge'){
      const base = 880 * Math.pow(2, -n/7) * Math.pow(2, Math.min(comboPitch,6)/12);
      tone(base*.7, t, .14, 'sine', .14, 1.6); tone(base*1.5, t+.05, .12, 'triangle', .06, 1.2);
      if (n >= 6) tone(base*.5, t, .3, 'sine', .1, 1.3);
    }
    if (kind === 'magic'){ [1046,1318,1568,2093].forEach((f,k)=>tone(f, t+k*.05, .2, 'triangle', .06)); }
    if (kind === 'whisk'){ for (let i=0;i<6;i++) tone(400 + (i%2)*180, t+i*.06, .08, 'sawtooth', .025, 1.4); }
    if (kind === 'crunch'){ tone(900, t, .05, 'square', .04, .4); tone(600, t+.03, .07, 'triangle', .05, .5); }
    if (kind === 'win'){ [523.25,659.25,783.99,1046.5,1318.5,1567.98].forEach((f,k)=>tone(f, t+k*.08, .4, 'triangle', .11)); }
    if (kind === 'star'){ tone(1046*Math.pow(2,n*4/12), t, .25, 'triangle', .09); }
    if (kind === 'warn'){ tone(330, t, .12, 'square', .03); }
    if (kind === 'over'){ [523,440,349,262].forEach((f,k)=>tone(f, t+k*.15, .32, 'sine', .11)); }
    if (kind === 'tap'){ tone(700, t, .04, 'sine', .04); }
  }catch(e){}
}

/* ---------- haptics (Android: Vibration API; iPhone 17.4+: hidden switch trick) ---------- */
const canVibrate = typeof navigator.vibrate === 'function';
let hapLabel = null;
function iosTap(){
  try{
    if (!hapLabel){
      hapLabel = document.createElement('label'); hapLabel.setAttribute('aria-hidden','true');
      hapLabel.style.cssText = 'position:fixed;left:0;top:0;width:1px;height:1px;opacity:0;pointer-events:none;overflow:hidden';
      const inp = document.createElement('input'); inp.type = 'checkbox'; inp.setAttribute('switch',''); inp.tabIndex = -1;
      hapLabel.append(inp); document.body.append(hapLabel);
    }
    hapLabel.click();
  }catch(e){}
}
function buzz(pattern){
  if (!hapticsOn || SIM) return;
  try{
    if (canVibrate){ navigator.vibrate(pattern); return; }
    const p = Array.isArray(pattern) ? pattern : [pattern];
    let at = 0;
    for (let i=0;i<p.length;i+=2){ if (at===0) iosTap(); else setTimeout(iosTap, at); at += (p[i]||0) + Math.max(p[i+1]||0, 70); }
  }catch(e){}
}

/* ---------- DOM / theme ---------- */
const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d');
let dpr = 1, VW = 0, VH = 0, SIM = false;
const cam = { S:1, cx:0, oy:0, Rx:18, Ry:18 };
function applyTheme(ed){
  const r = document.documentElement.style;
  r.setProperty('--accent', ed.accent); r.setProperty('--accentDark', ed.accentDark); r.setProperty('--ink', ed.ink);
  const sc = SCENE[ed.id] || {};
  $('sky').style.background = sc.bg ? `url("${sc.bg.src}") center top/cover no-repeat, ${ed.sky}` : ed.sky;
  $('banner').style.backgroundImage = sc.banner ? `url("${sc.banner.src}")` : '';
  $('banner').classList.toggle('css', !sc.banner);
  $('card').style.backgroundImage = sc.card ? `url("${sc.card.src}")` : '';
  $('card').classList.toggle('css', !sc.card);
}
function P(x, y){
  const k = kAt(y);
  return { x: cam.cx + (x - W/2) * k * cam.S, y: cam.oy + ttAt(y) * DEPTH * cam.S, k: k * cam.S };
}
function worldXAt(sx, y){ return (sx - cam.cx) / (kAt(y) * cam.S) + W/2; }
function rimUnits(){
  const r = (ED.scene && ED.scene.rim) || { x:.06, y:.045 };
  return { x: r.x * W / (1 - 2*r.x), y: r.y * L / (1 - 2*r.y) };
}
function resize(){
  dpr = Math.min(3, window.devicePixelRatio || 1);
  VW = window.innerWidth; VH = window.innerHeight;
  cv.width = Math.round(VW*dpr); cv.height = Math.round(VH*dpr);
  if ($('game').hidden) return;
  const RR = rimUnits(); cam.Rx = RR.x; cam.Ry = RR.y;
  const Rx = cam.Rx, R = cam.Ry;
  const hudB = $('hud').getBoundingClientRect().bottom;
  const bb = $('boosts');
  const botB = bb.hidden ? VH - Math.max(14, (parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--safe-b')) || 0) + 8)
                         : bb.getBoundingClientRect().top - 8;
  const top = hudB + 8, bottom = botB;
  const kN = kAt(L + R);
  const wU = (W + 2*Rx) * kN, span = ttAt(L + R) - ttAt(-R);
  let S = (VW - 28) / wU;
  DEPTH = Math.max(300, Math.min(420, ((bottom - top) / S - FRONT * kN) / span));
  const hU = span * DEPTH + FRONT * kN;
  cam.S = Math.min(S, (bottom - top) / hU);
  cam.cx = VW / 2;
  const h = hU * cam.S;
  const y0 = top + Math.max(0, (bottom - top - h) * .62);
  cam.oy = y0 - ttAt(-R) * DEPTH * cam.S;
  boardCache = null;
}
window.addEventListener('resize', ()=>{ resize(); if (!$('map').hidden) renderMap(); });

/* ---------- board: pre-rendered once per size ---------- */
let boardCache = null;
function roundPoly(g, pts, r){
  g.beginPath();
  for (let i=0;i<pts.length;i++){
    const p0 = pts[(i-1+pts.length)%pts.length], p1 = pts[i], p2 = pts[(i+1)%pts.length];
    const a = Math.atan2(p0.y-p1.y, p0.x-p1.x), b = Math.atan2(p2.y-p1.y, p2.x-p1.x);
    const s = [p1.x + Math.cos(a)*r, p1.y + Math.sin(a)*r], e = [p1.x + Math.cos(b)*r, p1.y + Math.sin(b)*r];
    if (i === 0) g.moveTo(s[0], s[1]); else g.lineTo(s[0], s[1]);
    g.quadraticCurveTo(p1.x, p1.y, e[0], e[1]);
  }
  g.closePath();
}
function buildBoard(){
  const c = document.createElement('canvas'); c.width = cv.width; c.height = cv.height;
  const Rx = cam.Rx, R = cam.Ry, wd = ED.wood, S = cam.S;
  const o = [P(-Rx,-R), P(W+Rx,-R), P(W+Rx,L+R), P(-Rx,L+R)];
  const ff = FRONT * kAt(L+R) * S;
  const T = document.createElement('canvas'); T.width = c.width; T.height = c.height;
  const t = T.getContext('2d'); t.scale(dpr, dpr);
  const tex = (SCENE[ED.id] || {}).board;
  if (tex){
    const yT = o[0].y, yB = o[3].y, tw = tex.naturalWidth, th = tex.naturalHeight;
    const rows = Math.ceil((yB - yT) * dpr), step = (yB - yT) / rows;
    for (let i=0;i<rows;i++){
      const sy = yT + i*step;
      const tt = (sy - cam.oy) / (DEPTH * S), k = KF + tt * (1 - KF);
      const wy = L + D0 - D0 / k;
      const v = Math.max(0, Math.min(1, (wy + R) / (L + 2*R)));
      const ww = (W + 2*Rx) * k * S;
      t.drawImage(tex, 0, Math.min(th - 1, v * th), tw, Math.max(1, th / rows * 1.5), cam.cx - ww/2, sy, ww, step + .6);
    }
  } else {
    const rg = t.createLinearGradient(0, o[0].y, 0, o[3].y);
    rg.addColorStop(0, shade(wd.rim, .12)); rg.addColorStop(1, wd.rim);
    roundPoly(t, o, 22*kAt(-R)*S); t.fillStyle = rg; t.fill();
    const n = [P(0,0), P(W,0), P(W,L), P(0,L)];
    const ig = t.createLinearGradient(0, n[0].y, 0, n[3].y);
    ig.addColorStop(0, wd.top); ig.addColorStop(1, wd.bottom);
    roundPoly(t, n, 12*S); t.fillStyle = ig; t.fill();
    t.save(); roundPoly(t, n, 12*S); t.clip();
    t.strokeStyle = wd.grain; t.lineWidth = 1.2;
    for (let x = 8; x < W; x += 13 + (x*7 % 11)){ const a = P(x, 0), b = P(x + ((x*13)%9 - 4), L); t.beginPath(); t.moveTo(a.x, a.y); t.lineTo(b.x, b.y); t.stroke(); }
    const sh = t.createLinearGradient(0, n[0].y, 0, n[0].y + 26*S);
    sh.addColorStop(0, 'rgba(120,50,40,.22)'); sh.addColorStop(1, 'rgba(120,50,40,0)');
    t.fillStyle = sh; t.fillRect(n[3].x, n[0].y, n[2].x - n[3].x, 26*S);
    t.restore();
    roundPoly(t, o, 22*kAt(-R)*S); t.strokeStyle = 'rgba(255,255,255,.55)'; t.lineWidth = 2; t.stroke();
  }
  const Dk = document.createElement('canvas'); Dk.width = c.width; Dk.height = c.height;
  const d = Dk.getContext('2d'); d.drawImage(T, 0, 0);
  d.globalCompositeOperation = 'source-atop';
  const fg = d.createLinearGradient(0, o[3].y * dpr, 0, (o[3].y + ff) * dpr);
  fg.addColorStop(0, wd.rim); fg.addColorStop(1, wd.rimDark);
  d.fillStyle = fg; d.fillRect(0, 0, Dk.width, Dk.height);
  const g = c.getContext('2d');
  g.save(); g.shadowColor = 'rgba(110,40,40,.30)'; g.shadowBlur = 26*S*dpr; g.shadowOffsetY = 12*S*dpr;
  g.drawImage(Dk, 0, ff*dpr); g.restore();
  for (let i = ff*dpr - 1; i > 0; i -= 2) g.drawImage(Dk, 0, i);
  g.drawImage(T, 0, 0);
  g.scale(dpr, dpr);
  g.save(); g.strokeStyle = 'rgba(255,255,255,.92)'; g.lineCap = 'round';
  const a = P(4, DANGER_Y), b = P(W-4, DANGER_Y);
  g.lineWidth = Math.max(2.5, 4 * a.k); g.setLineDash([16*a.k, 12*a.k]);
  g.beginPath(); g.moveTo(a.x, a.y); g.lineTo(b.x, b.y); g.stroke(); g.restore();
  boardCache = c;
}

/* ---------- boosters (earned, never bought) ---------- */
function boosts(){ return Object.assign({ rainbow:2, whisk:2, swap:3 }, store.json(K.boost) || {}); }
function setBoosts(b){ store.set(K.boost, JSON.stringify(b)); paintBoostCounts(); }
function giveBoost(key, n=1){ const b = boosts(); b[key] = (b[key]||0) + n; setBoosts(b); }
function randomBoost(rng=Math.random){ return ['rainbow','whisk','swap'][Math.floor(rng()*3)]; }

function whisk(){

}

/* ---------- game state ---------- */
let engine = null, G = null;
function newState(mode, opts={}){
  const spec = mode === 'adv' ? levelSpec(opts.level) : null;
  const daily = mode === 'daily' ? dailyInfo() : null;
  const G0 = {
    mode, level: spec ? spec.n : 0, spec, goal: spec ? spec.goal : null, made: 0,
    spawnMax: spec ? spec.spawnMax : 4,
    rng: daily ? mulberry32(daily.seed) : Math.random,
    shotsMax: spec ? (opts.unlimited ? 9999 : spec.shots) : daily ? 30 : null,
    shotsUsed: 0, outAt: 0,
    score:0, shown:0, combo:0, lastMerge:-1e9, maxTier:0, cubesCleared:0,
    aimX: W/2, holdReadyAt: 0, danger:0, warnBeat:0,
    over:false, won:false, paused:false, shake:0, fx:[], pops:[], t:0, saveAt:0, afterRB:null,
  };
  return G0;
}
function pickTier(){
  const w = SPAWN_W.slice(0, G.spawnMax + 1), sum = w.reduce((a,b)=>a+b,0);
  let r = G.rng()*sum;
  for (let i=0;i<w.length;i++){ r -= w[i]; if (r<0) return i; }
  return 0;
}
function makeWorld(){
  engine = Engine.create({ gravity:{ x:0, y:0 }, positionIterations:10, velocityIterations:8 });
  const T = 300, o = { isStatic:true, friction:0, restitution:.55, label:'wall' };
  Composite.add(engine.world, [
    Bodies.rectangle(W/2, -T/2, W + T*2, T, o), Bodies.rectangle(W/2, L + T/2, W + T*2, T, o),
    Bodies.rectangle(-T/2, L/2, T, L + T*2, o), Bodies.rectangle(W + T/2, L/2, T, L + T*2, o),
  ]);
  Events.on(engine, 'collisionStart', onCollide);
  Events.on(engine, 'collisionActive', onCollide);
}
function addPiece(tier, x, y, opt={}){
  const r = radOf(tier);
  const b = Bodies.circle(x, y, r, { restitution:.42, friction:.02, frictionStatic:.05, frictionAir:.021, density:.0012, slop:.02, label:'p' });
  Body.setInertia(b, Infinity);
  b.tier = tier; b.r = r; b.born = G.t; b.pop = opt.pop ? 1 : 0;
  b.safeUntil = G.t + (opt.safe ?? 900);
  b.sq = 0; b.sqv = 0;
  if (opt.vx || opt.vy) Body.setVelocity(b, { x:opt.vx||0, y:opt.vy||0 });
  Composite.add(engine.world, b);
  return b;
}
function addCube(x, y){
  const b = Bodies.rectangle(x, y, CUBE, CUBE, { chamfer:{ radius:10 }, restitution:.2, friction:.1, frictionAir:.07, density:.004, label:'cube' });
  Body.setInertia(b, Infinity);
  b.r = CUBE/2; b.born = G.t; b.safeUntil = G.t; b.sq = 0; b.sqv = 0; b.hp = G.spec && G.spec.kind === 'cubes' ? 1 : 2;
  Composite.add(engine.world, b);
  return b;
}
/* scatter starting pieces and cubes in the far part of the tray */
function seedBoard(nPieces, nCubes, maxT, rng){
  const placed = [];
  const fits = (x, y, r) => !placed.some(p => Math.hypot(p.x - x, p.y - y) < p.r + r + 8);
  for (let i=0, tries=0; i<nCubes && tries<400; tries++){
    const x = CUBE/2 + 10 + rng()*(W - CUBE - 20), y = 70 + rng()*(L*.42);
    if (!fits(x, y, CUBE*.72)) continue;
    placed.push({ x, y, r:CUBE*.72, t:-9 }); addCube(x, y); i++;
  }
  for (let i=0, tries=0; i<nPieces && tries<600; tries++){
    const t = Math.floor(rng() * (maxT + 1)), r = RADII[t];
    const x = r + 4 + rng()*(W - 2*r - 8), y = r + 6 + rng()*(L*.5);
    if (!fits(x, y, r) || placed.some(p => p.t === t && Math.hypot(p.x - x, p.y - y) < p.r + r + 40)) continue;
    placed.push({ x, y, r, t }); addPiece(t, x, y, { safe:0 }); i++;
  }
}

/* ---------- collisions & merging ---------- */
let mergeQ = [], cubeQ = [];
function onCollide(e){
  for (const p of e.pairs){
    const a = p.bodyA, b = p.bodyB;
    if (a.label === 'p' && b.label === 'p' && !a.gone && !b.gone){
      if (a.tier === RB && b.tier !== RB){ a.gone = b.gone = true; mergeQ.push({ rb:a, target:b }); continue; }
      if (b.tier === RB && a.tier !== RB){ a.gone = b.gone = true; mergeQ.push({ rb:b, target:a }); continue; }
      if (a.tier === b.tier && a.tier !== RB){ a.gone = b.gone = true; mergeQ.push({ a, b }); continue; }
    }
    if (e.name !== 'collisionStart') continue;
    const rv = Math.hypot(a.velocity.x - b.velocity.x, a.velocity.y - b.velocity.y);
    for (const [c, o] of [[a,b],[b,a]]){   // a hard hit cracks a cube, a second one breaks it
      if (c.label === 'cube' && o.label === 'p' && !c.gone && rv > 4.5 && G.t - (c.hitAt||0) > 250){ c.hitAt = G.t; c.hp--; c.shake = 1; if (c.hp <= 0) cubeQ.push(c); else sfx('crunch'); }
    }
    for (const body of [a,b]) if (body.label === 'p' && rv > 1.2) body.sqv += Math.min(rv, 16) * .1;
    if (rv > 3){
      if (a.label === 'wall' || b.label === 'wall') sfx('wall');
      else sfx('bump', Math.max(a.tier || 0, b.tier || 0));
    }
  }
}
function popCube(c){
  if (c.gone) return 0;
  c.gone = true; Composite.remove(engine.world, c);
  const cp = P(c.position.x, c.position.y);
  burst(cp.x, cp.y - CUBE*.3*cp.k, 0, 18, false, cp.k, '#ffffff'); sfx('crunch'); buzz(10);
  G.cubesCleared++;
  G.pops.push({ x:cp.x, y:cp.y - CUBE*cp.k, txt:'+10', t:0 });
  if (G.mode === 'adv' && G.spec.kind === 'cubes'){ paintCard(); if (G.cubesCleared >= G.spec.cubes && !G.won && !G.over) winLevel('cube'); }
  return 10;
}
function flushMerges(){
  if (cubeQ.length){ const q = cubeQ; cubeQ = []; for (const c of q) G.score += popCube(c); if (G.mode !== 'adv'){ updateBest(); paintCard(); } }
  if (!mergeQ.length) return;
  const q = mergeQ; mergeQ = [];
  for (const m of q){
    let x, y, t, vx, vy;
    if (m.rb){
      Composite.remove(engine.world, m.rb); Composite.remove(engine.world, m.target);
      x = m.target.position.x; y = m.target.position.y; t = m.target.tier; vx = m.target.velocity.x; vy = m.target.velocity.y;
      const sp = P(x, y); burst(sp.x, sp.y - radOf(t)*sp.k*.4, t, 24, true, sp.k); sfx('magic');
    } else {
      Composite.remove(engine.world, m.a); Composite.remove(engine.world, m.b);
      x = (m.a.position.x + m.b.position.x)/2; y = (m.a.position.y + m.b.position.y)/2; t = m.a.tier;
      vx = (m.a.velocity.x + m.b.velocity.x)*.3; vy = (m.a.velocity.y + m.b.velocity.y)*.3;
    }
    G.combo = (G.t - G.lastMerge < 1200) ? G.combo + 1 : 1;
    G.lastMerge = G.t; comboPitch = G.combo - 1;
    let pts = POINTS[Math.min(t+1, MAX)];
    if (G.combo > 1) pts += Math.round(pts * .25 * Math.min(G.combo-1, 6));
    const sp = P(x, y);
    let nr = RADII[MAX];
    if (t === MAX){
      pts = 200; burst(sp.x, sp.y - RADII[MAX]*sp.k*.4, MAX, 60, true, sp.k);
      sfx('win'); buzz([40,60,40,60,80]); G.shake = 12; toast('Crown Pop! +200');
    } else {
      const nt = t + 1; nr = RADII[nt];
      const nb = addPiece(nt, x, y, { pop:true, safe:700, vx, vy });
      nb.sqv = -1.4;
      burst(sp.x, sp.y - RADII[nt]*sp.k*.4, nt, 10 + nt*3, false, sp.k);
      sfx('merge', nt); buzz(nt >= 8 ? [25,40,35] : 8 + nt*2);
      if (nt >= 7) G.shake = Math.max(G.shake, nt - 4);
      if (nt > G.maxTier) G.maxTier = nt;
      discover(nt);
      if (G.mode === 'adv' && G.spec.kind === 'make' && nt >= G.goal && !G.won && !G.over){
        G.made++; paintCard();
        if (G.made >= G.spec.count) winLevel(nt); else toast(`${G.made} / ${G.spec.count}!`);
      }
      else if (G.combo >= 3) toast('Combo ×' + G.combo);
    }
    // merges crack nearby sugar cubes
    for (const c of engine.world.bodies.slice()){
      if (c.label !== 'cube' || c.gone) continue;
      if (Math.hypot(c.position.x - x, c.position.y - y) < nr + CUBE*.75 + 14) pts += popCube(c);
    }
    G.score += pts;
    G.pops.push({ x:sp.x, y:sp.y - nr*sp.k*1.1, txt:'+'+pts, t:0, big:t >= 6 || G.combo >= 3 });
  }
  if (G.mode !== 'adv'){ updateBest(); paintCard(); }
}

/* ---------- particles (screen space) ---------- */
function burst(x, y, tier, n, gold, k, only){
  if (SIM) return;
  const col = ED.tiers[Math.max(0, tier)].color, r = radOf(Math.max(0, tier)) * k;

  for (let i=0;i<n;i++){
    const a = Math.random()*Math.PI*2, sp = (1.8 + Math.random()*3.2) * (.7 + tier*.07) * k;

      rot: Math.random()*6, vr:(Math.random()-.5)*.4, size:(2.5 + Math.random()*3 + Math.max(0,tier)*.25) * k,

/* ---------- discovery / best / progress ---------- */
function seenSet(){ return new Set((store.get(K.seen(ED.id))||'0,1,2,3,4').split(',').map(Number)); }
function discover(t){ if (SIM) return; const s = seenSet(); if (s.has(t)) return; s.add(t); store.set(K.seen(ED.id), [...s].join(',')); }
function bestOf(id){ return +store.get(K.best(id)) || 0; }

function updateBest(){ if (G.mode === 'classic' && G.score > bestOf(ED.id)){ store.set(K.best(ED.id), G.score); G.newBest = true; } }

/* ---------- Daily Bake ---------- */
const DAY0 = Date.UTC(2026, 9, 28);
function todayKey(d=new Date()){ return d.getFullYear()*10000 + (d.getMonth()+1)*100 + d.getDate(); }
function dailyInfo(){
  const d = new Date(), key = todayKey(d);
  const num = Math.floor((Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) - DAY0) / 864e5) + 1;
  return { key, num, seed: key * 2654435761 % 4294967296 };
}
function dailyState(){ return Object.assign({ key:0, best:0, streak:0, last:0, played:0 }, store.json(K.daily) || {}); }

/* ---------- HUD ---------- */

function paintShots(){

/* ---------- input ---------- */
let aiming = false;
function clampAim(x){ const r = radOf(G.cur); return Math.max(r + 2, Math.min(W - r - 2, x)); }
function canAct(){ return G && !G.over && !G.won && !G.paused && !G.ending; }
cv.addEventListener('pointerdown', e=>{
  if (!canAct()) return;
  aiming = true; try{ cv.setPointerCapture(e.pointerId); }catch(_){}
  G.aimX = clampAim(worldXAt(e.clientX, LAUNCH_Y));
});
cv.addEventListener('pointermove', e=>{ if (canAct() && (aiming || e.pointerType === 'mouse')) G.aimX = clampAim(worldXAt(e.clientX, LAUNCH_Y)); });
cv.addEventListener('pointerup', e=>{
  if (!aiming) return; aiming = false;
  if (!canAct()) return;
  G.aimX = clampAim(worldXAt(e.clientX, LAUNCH_Y));
  shoot();
});
cv.addEventListener('pointercancel', ()=>{ aiming = false; });
window.addEventListener('keydown', e=>{
  if (!G || $('game').hidden) return;
  if (e.key === 'Escape'){ G.paused ? resume() : pause(); return; }
  if (!canAct()) return;
  if (e.key === 'ArrowLeft'){ G.aimX = clampAim(G.aimX - 14); e.preventDefault(); }
  if (e.key === 'ArrowRight'){ G.aimX = clampAim(G.aimX + 14); e.preventDefault(); }
  if (e.key === ' ' || e.key === 'ArrowUp' || e.key === 'Enter'){ shoot(); e.preventDefault(); }
});
function shoot(){
  if (!canAct() || G.t < G.holdReadyAt) return;
  if (G.shotsMax != null && G.shotsUsed >= G.shotsMax) return;
  const b = addPiece(G.cur, clampAim(G.aimX), LAUNCH_Y, { safe:1300, vy:-SHOT_V });
  b.sqv = -1.2;
  G.combo = 0; G.shotsUsed++;
  if (G.cur === RB){ G.cur = G.afterRB ?? pickTier(); G.afterRB = null; }
  else { G.cur = G.next; G.next = pickTier(); }
  G.holdReadyAt = G.t + 420;
  G.aimX = clampAim(G.aimX);
  if (G.shotsMax != null && G.shotsUsed >= G.shotsMax) G.outAt = G.t + 2600;   // let the last shot settle
  sfx('shoot'); buzz(8);
  if (!SIM){ paintIcon($('nextCv'), ED, G.next); paintShots(); paintBoostCounts(); }
}

/* ---------- simulation step (shared by the frame loop and the balancing bot) ---------- */
function advance(ms){
  let n = Math.round(ms / STEP);
  while (n-- > 0 && !G.over && !G.won && !G.ending){
    G.t += STEP;
    for (const b of engine.world.bodies){ b.px = b.position.x; b.py = b.position.y; }
    Engine.update(engine, STEP);
    flushMerges();
    step(STEP/1000);
  }
}
function step(dt){
  let over = false;
  for (const b of engine.world.bodies.slice()){
    if (b.label === 'wall') continue;
    if (b.label === 'p'){
      b.sqv += (-b.sq * 260 - b.sqv * 14) * dt;
      b.sq = Math.max(-.2, Math.min(.2, b.sq + b.sqv * dt));
      if (b.pop) b.pop = Math.max(0, 1 - (G.t - b.born)/240);
      if (b.tier === RB && G.t - b.born > 1500 && b.speed < .3 && !b.gone){   // a rainbow that found nothing fizzles
        b.gone = true; Composite.remove(engine.world, b);
        const s = P(b.position.x, b.position.y); burst(s.x, s.y, 0, 14, true, s.k);
        continue;
      }
    }
    if (G.t >= b.safeUntil && b.position.y > DANGER_Y && b.speed < 1.2) over = true;
  }
  if (over){
    G.danger += dt;
    if (G.danger > .4 && G.t - G.warnBeat > 600){ G.warnBeat = G.t; sfx('warn'); buzz(15); }
    if (G.danger > 2.6) endGame('full');
  } else G.danger = Math.max(0, G.danger - dt*2);
  if (G.outAt && G.t >= G.outAt && !G.won && !G.over){ endGame('shots'); }
  if (G.mode !== 'adv' && Math.round(G.shown) !== G.score){
    G.shown += (G.score - G.shown) * Math.min(1, dt*10);
    if (Math.abs(G.score - G.shown) < .5) G.shown = G.score;
    if (!SIM){ const n = $('cardBody').querySelector('.num'); if (n) n.textContent = Math.round(G.shown); }
  }
  G.shake *= Math.pow(.02, dt);
  if (!SIM && G.t - G.saveAt > 2500){ G.saveAt = G.t; saveGame(); }
}

/* ---------- main loop ---------- */
let last = 0, acc = 0, raf = 0;
function loop(now){
  raf = requestAnimationFrame(loop);
  if (!G || SIM) return;
  const dt = Math.min(100, now - (last || now)); last = now;
  if (canAct()){
    acc += dt;
    const n = Math.floor(acc / STEP);
    if (n > 0){ advance(n * STEP); acc -= n * STEP; }
  }
  fxTick(dt/1000);
  render();
}
function fxTick(dt){
  for (const p of G.fx){
    p.life += dt;
    if (!p.ring){ p.x += p.vx*dt*60; p.y += p.vy*dt*60; p.vy += .14*dt*60; p.vx *= Math.pow(.2, dt); p.rot += p.vr*dt*60; }
  }
  G.fx = G.fx.filter(p => p.life < p.max);
  for (const p of G.pops) p.t += dt;
  G.pops = G.pops.filter(p => p.t < .9);
}

/* ---------- rendering ---------- */
const easeOut = k => 1 - Math.pow(1-k, 3);
const easeOutBack = k => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3*Math.pow(k-1,3) + c1*Math.pow(k-1,2); };
function render(){
  const g = ctx;
  g.setTransform(1,0,0,1,0,0); g.clearRect(0,0,cv.width,cv.height);
  const sh = G.shake > .3 ? G.shake : 0;
  g.setTransform(dpr,0,0,dpr, dpr*(Math.random()-.5)*sh, dpr*(Math.random()-.5)*sh);
  if (!boardCache) buildBoard();
  g.save(); g.setTransform(1,0,0,1,0,0); g.drawImage(boardCache, 0, 0); g.restore();
  if (G.danger > 0){
    const w = Math.min(1, G.danger/1.2) * (.55 + .45*Math.sin(G.t/90));
    const a = P(0, DANGER_Y), b = P(W, DANGER_Y), c = P(W, L), d = P(0, L);
    g.fillStyle = `rgba(255,60,90,${.28*w})`;
    g.beginPath(); g.moveTo(a.x,a.y); g.lineTo(b.x,b.y); g.lineTo(c.x,c.y); g.lineTo(d.x,d.y); g.closePath(); g.fill();
  }
  const al = canAct() ? acc / STEP : 1;
  const list = [];
  for (const b of engine.world.bodies){
    if (b.label !== 'p' && b.label !== 'cube') continue;
    const x = b.px == null ? b.position.x : b.px + (b.position.x - b.px)*al;
    const y = b.py == null ? b.position.y : b.py + (b.position.y - b.py)*al;
    if (b.shake) b.shake = Math.max(0, b.shake - .06);
    list.push(b.label === 'cube' ? { cube:true, hp:b.hp, x: x + (b.shake ? Math.sin(G.t/18)*3*b.shake : 0), y, r:CUBE/2, sq:0, pop:0 } : { t:b.tier, x, y, r:b.r, sq:b.sq, pop:b.pop });
  }
  const outOfShots = G.shotsMax != null && G.shotsUsed >= G.shotsMax;
  const ready = G.t >= G.holdReadyAt && !G.over && !G.won && !outOfShots;
  const ax = clampAim(G.aimX);
  if (!G.over && !G.won && !outOfShots){
    const k = Math.min(1, Math.max(0, 1 - (G.holdReadyAt - G.t)/420));
    list.push({ t:G.cur, x:ax, y:LAUNCH_Y, r:radOf(G.cur), sq:0, pop:1 - easeOutBack(k) });
  }
  if (ready){
    const a = P(ax, LAUNCH_Y - radOf(G.cur)), b = P(ax, 6);
    g.save(); g.strokeStyle = G.cur === RB ? 'rgba(255,215,90,.98)' : 'rgba(255,255,255,.95)'; g.lineCap = 'round'; g.lineWidth = Math.max(2, 3.2*a.k);
    g.shadowColor = 'rgba(120,50,50,.25)'; g.shadowBlur = 4;
    g.beginPath(); g.moveTo(a.x, a.y); g.lineTo(b.x, b.y); g.stroke(); g.restore();
  }
  list.sort((p,q) => p.y - q.y);
  for (const p of list){
    const s = P(p.x, p.y), rx = p.r*s.k*.92*(1 - p.pop*.4);
    g.fillStyle = 'rgba(120,45,40,.22)';
    g.beginPath(); g.ellipse(s.x, s.y + rx*.1, rx, rx*tiltAt(p.y)*.9, 0, 0, Math.PI*2); g.fill();
  }
  for (const p of list) drawPiece(g, p);
  for (const p of G.fx){
    const k = p.life / p.max;
    if (p.ring){
      g.save(); g.globalAlpha = (1-k)*.85; g.strokeStyle = '#fff'; g.lineWidth = 6*(1-k) + 1;
      const rr = p.r + (p.R-p.r)*easeOut(k);
      g.beginPath(); g.ellipse(p.x, p.y, rr, rr*.8, 0, 0, Math.PI*2); g.stroke(); g.restore();
      continue;
    }
    g.save(); g.globalAlpha = 1 - k*k; g.translate(p.x, p.y); g.rotate(p.rot); g.fillStyle = p.col;
    const s = p.size*(1 - k*.4);
    if (p.kind === 'star') star(g, s*1.2);
    else if (p.kind === 'bar'){ roundRect(g, -s, -s*.35, s*2, s*.7, s*.35); g.fill(); }
    else { g.beginPath(); g.arc(0,0,s*.7,0,Math.PI*2); g.fill(); }
    g.restore();
  }
  for (const p of G.pops){
    const k = p.t/.9, sz = p.big ? 30 : 22;
    g.save(); g.globalAlpha = 1 - Math.max(0, (k - .6)/.4);
    g.font = `${sz}px 'Lilita One', 'Fredoka', sans-serif`; g.textAlign = 'center'; g.textBaseline = 'middle';
    const y = p.y - easeOut(Math.min(1,k*1.6))*34, sc = k < .15 ? .6 + k/.15*.5 : 1.1 - Math.min(.1,(k-.15));
    g.translate(p.x, y); g.scale(sc, sc);
    g.lineWidth = 5; g.strokeStyle = ED.accentDark; g.lineJoin = 'round'; g.strokeText(p.txt, 0, 0);
    g.fillStyle = '#fff'; g.fillText(p.txt, 0, 0); g.restore();
  }
}
function drawPiece(g, p){
  const s = P(p.x, p.y), r = p.r;
  const d = 2 * r * s.k * (p.cube ? 1.12 : 1.03);
  const sp = sprite(ED, p.cube ? 'cube' : p.t, d * dpr);
  const ps = p.pop ? 1 - p.pop*.45 + Math.sin((1-p.pop)*Math.PI)*.12 : 1;
  g.save();
  g.translate(s.x, s.y + r*s.k*tiltAt(p.y)*.55);
  g.scale((1 + p.sq)*ps, (1 - p.sq)*ps);
  if (p.t === RB){ g.rotate(Math.sin(G.t/150)*.15); }
  g.drawImage(sp, -d/2, -d, d, d);
  if (p.cube && p.hp === 1){   // a crack across the cube
    g.strokeStyle = 'rgba(120,90,120,.75)'; g.lineWidth = Math.max(1.5, d*.035); g.lineJoin = 'round'; g.lineCap = 'round';
    g.beginPath(); g.moveTo(-d*.3, -d*.78); g.lineTo(-d*.08, -d*.6); g.lineTo(-d*.16, -d*.45); g.lineTo(d*.1, -d*.3); g.lineTo(d*.04, -d*.18); g.stroke();
  }
  g.restore();
}
function roundRect(g, x, y, w, h, r){
  g.beginPath(); g.moveTo(x+r, y); g.lineTo(x+w-r, y); g.quadraticCurveTo(x+w, y, x+w, y+r);
  g.lineTo(x+w, y+h-r); g.quadraticCurveTo(x+w, y+h, x+w-r, y+h); g.lineTo(x+r, y+h);
  g.quadraticCurveTo(x, y+h, x, y+h-r); g.lineTo(x, y+r); g.quadraticCurveTo(x, y, x+r, y); g.closePath();
}
function star(g, r){
  g.beginPath();
  for (let i=0;i<10;i++){ const a = i*Math.PI/5 - Math.PI/2, rr = i%2 ? r*.45 : r; g.lineTo(Math.cos(a)*rr, Math.sin(a)*rr); }
  g.closePath(); g.fill();
}
function redrawStatic(){
  if (!ED) return;
  if (G && !$('game').hidden){ paintIcon($('nextCv'), ED, G.next); paintCard(); }

/* ---------- save / resume ---------- */
function saveGame(){
  if (!G || G.over || G.won || G.ending || !engine || SIM) return;
  const bodies = engine.world.bodies.filter(b => (b.label === 'p' && b.tier !== RB || b.label === 'cube') && !b.gone).map(b => [
    b.label === 'cube' ? 'c' : b.tier, +b.position.x.toFixed(1), +b.position.y.toFixed(1), +b.velocity.x.toFixed(2), +b.velocity.y.toFixed(2) ]);
  store.set(K.save, JSON.stringify({ v:3, ed:ED.id, mode:G.mode, level:G.level, day:G.mode === 'daily' ? dailyInfo().key : 0,
    score:G.score, cur:G.cur === RB ? G.afterRB : G.cur, rb:G.cur === RB, next:G.next, maxTier:G.maxTier, aimX:G.aimX, used:G.shotsUsed, bodies }));
}
function clearSave(){ store.del(K.save); }
function savedGame(){
  const s = store.json(K.save);
  if (!s || s.v !== 3) return null;
  if (s.mode === 'daily' && s.day !== dailyInfo().key) return null;
  return s;
}
document.addEventListener('visibilitychange', ()=>{ if (document.hidden){ if (canAct() && !$('game').hidden) pause(); else saveGame(); } });
window.addEventListener('pagehide', saveGame);

/* ---------- flow ---------- */
function show(id){ for (const s of ['home','map','game']) $(s).hidden = s !== id; }
function setEdition(id){
  ED = EDITIONS.find(e => e.id === id && !e.soon) || EDITIONS[0];
  store.set(K.ed, ED.id); loadArt(ED); applyTheme(ED);
}
function startGame(mode, opts={}){
  const saved = opts.resume ? savedGame() : null;
  if (saved){ setEdition(saved.ed); mode = saved.mode; opts.level = saved.level; }
  show('game'); closeAll(); $('toast').classList.remove('show');
  G = newState(mode, opts);
  makeWorld();
  $('bannerTxt').textContent = mode === 'adv' ? 'Level ' + G.level : mode === 'daily' ? 'Daily Bake' : 'Classic';
  $('boosts').hidden = mode === 'daily';
  $('next').disabled = mode === 'daily';
  if (saved){
    G.score = G.shown = saved.score; G.maxTier = saved.maxTier || 0; G.aimX = saved.aimX ?? W/2; G.shotsUsed = saved.used || 0;
    for (const [t,x,y,vx,vy] of saved.bodies){ if (t === 'c') addCube(x, y); else addPiece(t, x, y, { vx, vy, safe:1500 }); }
    if (mode === 'daily'){ for (let i=0;i<G.shotsUsed*2 + 2;i++) G.rng(); }   // keep today's sequence in step
    G.cur = saved.cur; G.next = saved.next;
    if (saved.rb) giveBoost('rainbow');          // an armed rainbow goes back in the jar
    if (G.shotsMax != null && G.shotsUsed >= G.shotsMax) G.outAt = 1;
  } else {
    clearSave();
    if (mode === 'adv'){ const sp = G.spec; seedBoard(sp.seeds, sp.cubes, sp.kind === 'cubes' ? 3 : Math.min(3, sp.goal - 2), mulberry32(sp.n * 7919 + 13)); }
    if (mode === 'daily'){ seedBoard(5, 2, 3, G.rng); }
    G.cur = pickTier(); G.next = pickTier();
  }
  paintCard(); paintShots(); paintBoostIcons(); paintBoostCounts();
  resize();
  G.aimX = clampAim(G.aimX);
  paintIcon($('nextCv'), ED, G.next);
  last = 0; acc = 0;
  if (!raf) raf = requestAnimationFrame(loop);
}
function pause(){ if (!canAct()) return; G.paused = true; saveGame(); syncToggles(); $('mPause').hidden = false; }
function resume(){ if (!G) return; G.paused = false; last = 0; $('mPause').hidden = true; }
function goHome(){ saveGame(); closeAll(); show('home'); G = null; engine = null; renderHome(); }
function goMap(){ closeAll(); G = null; engine = null; openMap(); }

function endGame(why){
  G.why = why;
  if (G.mode === 'daily'){ finishDaily(why); return; }
  G.over = true; clearSave();

  sfx('over'); buzz([60,80,60]);
  if (G.mode === 'classic'){

  } else {

}
function starsFor(used, max){ const f = used / max; return f <= .6 ? 3 : f <= .8 ? 2 : 1; }
function winLevel(tier){
  G.won = true; clearSave();
  if (SIM) return;
  const n = G.level, stars = starsFor(G.shotsUsed, G.shotsMax);
  const all = starsOf(ED.id), prev = all[n] || 0;
  all[n] = Math.max(prev, stars); store.set(K.stars(ED.id), JSON.stringify(all));
  const firstClear = unlockedOf(ED.id) <= n;
  if (firstClear) store.set(K.lvl(ED.id), n + 1);
  // rewards: a booster for a new ★★★, a full set at every 5th level the first time
  const rewards = [];
  if (stars === 3 && prev < 3){ const k = randomBoost(); giveBoost(k); rewards.push(k); }
  if (G.spec.gift && firstClear){ for (const k of ['rainbow','whisk','swap']) giveBoost(k); rewards.push('rainbow','whisk','swap'); }
  setTimeout(()=>{ sfx('win'); buzz([30,50,30,50,60]); }, 250);
  for (let i=0;i<stars;i++) setTimeout(()=>sfx('star', i), 1300 + i*250);
  toast(tier === 'cube' ? 'All cracked!' : ED.tiers[tier].name + '!');
  $('winTitle').textContent = `Level ${n} done!`;
  $('winStars').innerHTML = [1,2,3].map(i => `<span class="st ${i <= stars ? 'on' : 'off'}"></span>`).join('');
  $('winSub').textContent = (tier === 'cube' ? `Cracked them all in ${G.shotsUsed} shot${G.shotsUsed === 1 ? '' : 's'}.` : `Done in ${G.shotsUsed} shot${G.shotsUsed === 1 ? '' : 's'}.`) + (stars < 3 ? ` ★★★ needs ${Math.floor(G.shotsMax*.6)} or fewer.` : '');
  const rw = $('winReward'); rw.innerHTML = '';
  if (rewards.length){
    const box = document.createElement('div'); box.className = 'reward';
    box.append(document.createTextNode(G.spec.gift && firstClear ? 'Gift! ' : 'New ★★★! '));
    for (const k of rewards) box.append(boostIcon(k, 36));
    box.append(document.createTextNode(rewards.length === 1 ? ' +1 ' + BOOST_NAMES[rewards[0]] : ' +1 each'));
    rw.append(box);
  }
  paintIcon($('winCv'), ED, tier);
  setTimeout(()=>{ if (G && G.won) $('mWin').hidden = false; }, 1100);
}
function finishDaily(why){
  if (G.ending) return;
  G.ending = true; clearSave();
  if (SIM){ G.over = true; return; }
  const di = dailyInfo(), ds = dailyState();
  const first = ds.key !== di.key;
  if (first){
    const y = new Date(); y.setDate(y.getDate() - 1);
    ds.streak = ds.last === todayKey(y) ? ds.streak + 1 : 1;
    ds.last = di.key; ds.key = di.key; ds.best = 0; ds.played = (ds.played || 0) + 1;
  }
  const newBest = G.score > ds.best;
  ds.best = Math.max(ds.best, G.score);
  store.set(K.daily, JSON.stringify(ds));
  let gift = null;
  if (first){ gift = randomBoost(); giveBoost(gift); }
  sfx(newBest ? 'win' : 'over'); buzz([30,50,30]);
  $('dTitle').textContent = `Daily Bake #${di.num}`;
  $('dScore').textContent = G.score;
  $('dSub').textContent = (why === 'full' ? 'Board filled up. ' : 'All 30 shots used. ') + `Reached ${ED.tiers[G.maxTier].name}.` + (first ? '' : ` Today's best: ${ds.best}`);
  $('dStreak').innerHTML = `<span class="streak">🔥 ${ds.streak}-day streak</span>`;
  const txt = `Mergebloom Daily Bake #${di.num}\n${G.score} pts · reached ${ED.tiers[G.maxTier].name}\n${'🧁'.repeat(Math.min(5, Math.max(1, G.maxTier - 3)))} 🔥${ds.streak}\npanpenk.github.io/mergebloom`;
  $('dShare').textContent = txt; $('btnShare').dataset.txt = txt;
  const rw = $('dReward'); rw.innerHTML = '';
  if (gift){ const box = document.createElement('div'); box.className = 'reward'; box.append(boostIcon(gift, 36), document.createTextNode(` Daily gift: +1 ${BOOST_NAMES[gift]}`)); rw.append(box); }
  setTimeout(()=>{ $('mDaily').hidden = false; }, 900);
}

function heroLoop(now){
  heroRaf = 0;
  if ($('home').hidden || !ED) return;
  const c = $('heroCv'), g = c.getContext('2d'), Wc = c.width;
  g.clearRect(0,0,Wc,Wc);

  for (const [t,x,y,sz,ph] of items){
    const d = Wc*sz, bob = Math.sin(now/700 + ph)*Wc*.012, rot = Math.sin(now/1100 + ph)*.06;
    g.save(); g.translate(x*Wc, y*Wc + bob); g.rotate(rot); g.drawImage(sprite(ED, t, d), -d/2, -d/2, d, d); g.restore();

}

/* ---------- level map ---------- */
const SPACING = 124;
function openMap(){ show('map'); renderMap(true); }
function renderMap(scrollToCurrent){
  const inner = $('mapInner'), scroller = $('mapScroll');
  const unlocked = unlockedOf(ED.id), all = starsOf(ED.id);
  const count = unlocked + 14;
  const wpx = scroller.clientWidth || VW, hpx = count * SPACING + 260;
  inner.style.height = hpx + 'px';
  const sc = SCENE[ED.id] || {};
  inner.style.backgroundImage = sc.map ? `url("${sc.map.src}")` : `radial-gradient(rgba(255,255,255,.55) 2.4px, transparent 2.6px), ${ED.sky}`;
  inner.style.backgroundSize = sc.map ? '100% auto' : '26px 26px, 100% 100%';
  inner.style.backgroundRepeat = sc.map ? 'repeat-y' : 'repeat, no-repeat';
  $('mapTitle').textContent = ED.name + ' Road';
  $('mapStars').textContent = totalStars(ED.id);
  const pos = n => ({ x: wpx/2 + Math.sin(n*.9) * Math.min(wpx*.27, 130), y: hpx - 170 - (n-1)*SPACING });
  // frosting path
  let d = '';
  for (let n=1;n<=count;n++){ const p = pos(n); if (n === 1) d += `M${p.x},${p.y}`; else { const q = pos(n-1), my = (p.y + q.y)/2; d += ` C${q.x},${my} ${p.x},${my} ${p.x},${p.y}`; } }
  inner.innerHTML = `<svg viewBox="0 0 ${wpx} ${hpx}" preserveAspectRatio="none">
    <path d="${d}" fill="none" stroke="rgba(150,60,70,.18)" stroke-width="26" stroke-linecap="round" transform="translate(0,5)"/>
    <path d="${d}" fill="none" stroke="#fff7f0" stroke-width="22" stroke-linecap="round"/>
    <path d="${d}" fill="none" stroke="#ffb3c9" stroke-width="6" stroke-linecap="round" stroke-dasharray="2 16"/></svg>`;
  for (let n=1;n<=count;n++){
    const p = pos(n), spec = levelSpec(n), st = all[n] || 0;
    const el = document.createElement('button');
    el.className = 'node' + (n < unlocked || st ? ' done' : '') + (n === unlocked ? ' cur' : '') + (n > unlocked ? ' lock' : '') + (p.x > wpx/2 ? ' flip' : '');
    el.style.left = p.x + 'px'; el.style.top = p.y + 'px';
    el.innerHTML = `<div class="b">${n}</div><div class="stars">${n < unlocked || st ? [1,2,3].map(i => `<span class="st ${i <= st ? 'on' : 'off'}"></span>`).join('') : ''}</div>`;
    if (spec.gift && n >= unlocked){ const gb = document.createElement('div'); gb.className = 'gift'; gb.append(boostIcon('rainbow', 30)); el.append(gb); }
    if (n === unlocked){ const gc = document.createElement('canvas'); gc.className = 'goal'; gc.width = gc.height = 186; paintIcon(gc, ED, goalIcon(spec)); el.append(gc); }
    el.onclick = ()=>{ if (n > unlocked){ sfx('warn'); el.animate([{transform:'translate(-50%,-50%)'},{transform:'translate(-56%,-50%)'},{transform:'translate(-44%,-50%)'},{transform:'translate(-50%,-50%)'}],{duration:240}); return; } sfx('tap'); openLevel(n); };
    inner.append(el);
  }
  if (scrollToCurrent){ const p = pos(unlocked); scroller.scrollTop = Math.max(0, p.y - scroller.clientHeight*.58); }
}

  ED.tiers.forEach((t,i)=>{
    const d = document.createElement('div');
    d.innerHTML = `<canvas width="174" height="174"></canvas><span class="${seen.has(i)?'':'q'}">${seen.has(i) ? t.name : '???'}</span>`;
    paintIcon(d.querySelector('canvas'), ED, i, { silhouette: !seen.has(i), scale:.5 + .5*(RADII[i]/RADII[MAX]) });
    box.append(d);
  });
  $('mBook').hidden = false;
}
async function copyShare(){
  const txt = $('btnShare').dataset.txt || '';
  try{ await navigator.clipboard.writeText(txt); $('btnShare').textContent = 'Copied!'; }
  catch(e){
    const r = document.createRange(); r.selectNodeContents($('dShare'));
    const s = getSelection(); s.removeAllRanges(); s.addRange(r); $('btnShare').textContent = 'Selected, tap Copy';
  }
  setTimeout(()=>{ $('btnShare').textContent = 'Copy result'; }, 1800);
}
$('btnPause').onclick = ()=>{ sfx('tap'); pause(); };

$('btnAgain').onclick = ()=>{ sfx('tap'); startGame(G.mode, { level:G.level }); };
$('btnOverHome').onclick = ()=>{ sfx('tap'); const m = G.mode; clearSave(); if (m === 'adv') goMap(); else goHome(); };
$('btnNext').onclick = ()=>{ sfx('tap'); startGame('adv', { level:G.level + 1 }); };
$('btnWinMap').onclick = ()=>{ sfx('tap'); goMap(); };
$('btnContinue').onclick = ()=>{ sfx('tap'); startGame(null, { resume:true }); };
$('btnAdv').onclick = ()=>{ sfx('tap'); openMap(); };
$('btnDaily').onclick = ()=>{ sfx('tap'); startGame('daily'); };
$('btnClassic').onclick = ()=>{ sfx('tap'); startGame('classic'); };
$('btnMapBack').onclick = ()=>{ sfx('tap'); show('home'); renderHome(); };

if (document.fonts && document.fonts.ready) document.fonts.ready.then(()=>renderHome());
if ('serviceWorker' in navigator && location.protocol.startsWith('http')){
  window.addEventListener('load', ()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}

/* ---------- test & balancing hooks ---------- */
window.__mb = {
  get G(){ return G; }, get engine(){ return engine; }, shoot, startGame, levelSpec, RADII, W, L, DANGER_Y, P,
  addPiece:(t,x,y)=>addPiece(t,x,y,{safe:0}), addCube, advance, useBoost,
  // play a level headlessly with random aim; returns shots used to reach the goal (or null)
  bot(n, maxShots=300, seed=1){
    SIM = true; const rnd = mulberry32(seed);
    startGame('adv', { level:n, unlimited:true });
    G.rng = mulberry32(seed * 31 + 7);
    G.cur = pickTier(); G.next = pickTier();
    let res = null;
    for (let i=0;i<maxShots;i++){
      let x = 30 + rnd()*(W - 60);
      if (this.smart){   // aim at the nearest matching piece, like a person would
        const ps = engine.world.bodies.filter(b => b.label === 'p' && b.tier === G.cur);
        const cubes = engine.world.bodies.filter(b => b.label === 'cube');
        if (G.spec.kind === 'cubes' && cubes.length && rnd() < .5){ x = cubes[Math.floor(rnd()*cubes.length)].position.x + (rnd()-.5)*12; }
        else if (ps.length){ ps.sort((a,b) => b.position.y - a.position.y); x = ps[0].position.x + (rnd()-.5)*10; }
        else { const big = engine.world.bodies.filter(b => b.label === 'p').sort((a,b) => b.tier - a.tier)[0];
               if (big) x = big.position.x < W/2 ? W - 40 - rnd()*80 : 40 + rnd()*80; }
      }
      G.aimX = clampAim(x); G.holdReadyAt = 0; shoot();
      advance(750);
      if (G.won){ res = G.shotsUsed; break; }
      if (G.over){ window.__lastWhy = { why:G.why, used:G.shotsUsed, cracked:G.cubesCleared, pieces:engine.world.bodies.filter(b=>b.label==='p').length }; break; }
    }
    SIM = false; G = null; engine = null; show('home');
    return res;
  },
};
